    <style>
      body {
        font-family: 'Inter', sans-serif;
        /* Previene il refresh pull-down su mobile che rompe l'effetto app */
        overscroll-behavior-y: none; 
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
      }

      /* --- IRON MAN FLARE EFFECT --- */
      .iron-flare {
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
      }
      
      /* Il raggio di luce */
      .iron-flare::after {
        content: '';
        position: absolute;
        top: 0;
        left: -150%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.4),
          rgba(34, 211, 238, 0.6), /* Cyan glow */
          transparent
        );
        transform: skewX(-25deg);
        transition: none;
        pointer-events: none;
        z-index: 10;
      }
      
      /* Trigger on Hover */
      .iron-flare:hover::after {
        left: 150%;
        transition: 0.6s ease-in-out;
      }

      .iron-flare:hover {
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.4); /* External Cyan Glow */
        border-color: rgba(34, 211, 238, 0.8);
      }

      /* --- TABLE ROW HOLOGRAM EFFECT --- */
      .hologram-row {
        transition: all 0.2s ease;
        position: relative;
      }
      
      .hologram-row:hover {
        background-color: rgba(6, 182, 212, 0.05) !important; /* Very light cyan tint */
        box-shadow: inset 0 0 15px rgba(6, 182, 212, 0.15), inset 4px 0 0 #06b6d4; /* Inner glow + Left border indicator */
        z-index: 1;
        transform: scale(1.005);
      }

      /* --- REPULSOR BLAST CELEBRATION --- */
      @keyframes repulsor-charge {
        0% { transform: scale(0.5); opacity: 0; }
        50% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 20px cyan); }
        100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 50px cyan); }
      }
      
      @keyframes shockwave-expand {
        0% { transform: scale(0); opacity: 0.8; border-width: 50px; }
        100% { transform: scale(4); opacity: 0; border-width: 0px; }
      }

      .animate-repulsor-charge {
        animation: repulsor-charge 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      
      .animate-shockwave {
        animation: shockwave-expand 1s ease-out forwards;
        animation-delay: 0.4s;
      }
    </style>
